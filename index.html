<style>
  :root{
    --bg:#f4f4f2; --card:#ffffff; --card2:#f0f0ee; --line:#e7e7e3;
    --txt:#1b1b1a; --sub:#77776f; --muted:#a3a39b;
    --accent:#3f6ef2; --accent-soft:#e9f0fe; --accent-line:#c5d8fb;
    --green:#1f9d55; --amber:#c07d0a;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}
  #app{max-width:440px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:96px;}
  .hidden{display:none!important;}
  svg{stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  /* appbar */
  .appbar{position:sticky;top:0;z-index:15;background:var(--bg);
    display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;}
  .bookchip{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);
    color:var(--txt);font-size:15px;font-weight:700;padding:9px 14px;border-radius:22px;max-width:78%;}
  .bookchip .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bookchip svg{width:16px;height:16px;color:var(--sub);}
  .bookchip .bemoji svg{width:18px;height:18px;color:var(--accent);}
  .appbar-right{display:flex;align-items:center;gap:8px;}
  .whoami{background:var(--card);border:1px solid var(--line);color:var(--txt);font-size:13px;
    font-weight:600;padding:8px 12px;border-radius:20px;display:flex;align-items:center;gap:6px;}
  .whoami .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);}
  /* summary */
  .summary{display:flex;gap:12px;padding:4px 16px 14px;}
  .sumcard{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;}
  .sumcard .lbl{font-size:12px;color:var(--sub);margin-bottom:3px;}
  .sumcard .val{font-size:20px;font-weight:800;letter-spacing:-.4px;}
  /* list */
  .dayhdr{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding:14px 20px 6px;}
  .row{display:flex;align-items:center;gap:12px;padding:11px 14px;margin:0 12px 8px;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);cursor:pointer;transition:transform .08s;}
  .row:active{transform:scale(.99);}
  .ico{width:40px;height:40px;border-radius:11px;background:var(--card2);flex:0 0 40px;
    display:flex;align-items:center;justify-content:center;color:var(--txt);}
  .ico svg{width:21px;height:21px;}
  .ico.tr{background:var(--accent-soft);color:var(--accent);}
  .rmid{flex:1;min-width:0;}
  .rdesc{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rmeta{font-size:12px;color:var(--sub);margin-top:1px;}
  .ramt{font-size:16px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;}
  .pill{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;
    background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:1px;}
  .empty{color:var(--muted);text-align:center;padding:50px 24px;font-size:14px;line-height:1.6;}
  /* balances */
  .balwrap{padding:6px 16px;}
  .balhero{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;text-align:center;margin-bottom:14px;}
  .balhero .who{font-size:14px;color:var(--sub);}
  .balhero .big{font-size:32px;font-weight:800;letter-spacing:-.6px;margin:6px 0 0;}
  .balrow{display:flex;justify-content:space-between;padding:14px 16px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);margin-bottom:8px;font-size:14px;}
  .balrow .nm{font-weight:700;}
  .balrow .r{text-align:right;color:var(--sub);line-height:1.5;}
  .settle-note{font-size:12px;color:var(--muted);text-align:center;padding:8px 24px 0;line-height:1.55;}
  /* capture */
  .datebtn{position:relative;background:var(--card);border:1px solid var(--line);color:var(--txt);font-size:15px;font-weight:700;
    padding:9px 14px;border-radius:22px;display:flex;align-items:center;gap:7px;cursor:pointer;}
  .datebtn svg{width:16px;height:16px;color:var(--sub);}
  .datebtn input[type=date]{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;margin:0;padding:0;cursor:pointer;-webkit-appearance:none;appearance:none;}
  .amount-wrap{display:flex;align-items:center;justify-content:center;padding:12px 18px 4px;gap:3px;}
  .amount-wrap .cur{font-size:26px;color:var(--muted);font-weight:700;}
  .amount-input{border:0;background:transparent;outline:none;font-family:inherit;font-size:48px;font-weight:800;
    letter-spacing:-1.5px;text-align:center;color:var(--txt);width:100%;max-width:260px;padding:0;}
  .amount-input::placeholder{color:var(--muted);}
  .namewrap{padding:0 16px 2px;}
  .nameinput{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:13px 14px;
    font-size:15px;font-family:inherit;color:var(--txt);outline:none;}
  .nameinput:focus{border-color:var(--accent-line);}
  .nameinput::placeholder{color:var(--muted);}
  .seg-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:8px 20px 5px;font-weight:700;}
  .seg{display:flex;gap:8px;padding:0 16px;}
  .seg .opt{flex:1;text-align:center;padding:11px 0;border-radius:12px;background:var(--card);border:1px solid var(--line);
    font-size:14px;font-weight:600;color:var(--sub);display:flex;align-items:center;justify-content:center;gap:6px;}
  .seg .opt svg{width:15px;height:15px;}
  .seg .opt.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line);}
  .catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:6px 16px 4px;}
  .cat{text-align:center;padding:9px 2px;border-radius:12px;border:1.5px solid transparent;cursor:pointer;}
  .cat svg{width:21px;height:21px;color:var(--txt);}
  .cat .n{font-size:10.5px;color:var(--sub);margin-top:3px;line-height:1.1;font-weight:600;}
  /* pill row: Paid by · Split · Date (same height) */
  .pillrow{display:flex;gap:8px;padding:8px 16px 2px;}
  .cpill{flex:1;min-width:0;height:42px;display:flex;align-items:center;justify-content:center;gap:5px;background:var(--card);
    border:1px solid var(--line);border-radius:22px;padding:0 12px;font-size:13px;font-weight:700;color:var(--txt);cursor:pointer;}
  .cpill .plab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cpill .chev{color:var(--muted);font-size:12px;flex:0 0 auto;}
  .cpill svg{width:15px;height:15px;color:var(--sub);flex:0 0 auto;}
  .cpill.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);}
  .datepill{position:relative;flex:0 0 auto;}
  .datepill input[type=date]{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;margin:0;padding:0;cursor:pointer;-webkit-appearance:none;appearance:none;}
  /* split dropdown options */
  .split-panel{padding:6px 16px 2px;}
  .sopt{padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:6px;
    font-size:14px;font-weight:600;color:var(--txt);cursor:pointer;}
  .sopt.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);}
  .savebtn{margin:12px 16px 2px;padding:16px;border-radius:14px;background:var(--accent);border:0;
    color:#fff;font-size:17px;font-weight:700;width:calc(100% - 32px);display:flex;align-items:center;justify-content:center;gap:8px;}
  .savebtn svg{width:18px;height:18px;color:#fff;stroke-width:2.2;}
  .savebtn:disabled{opacity:.4;}
  .cancel-add{display:block;margin:2px auto 0;background:0;border:0;color:var(--sub);font-size:14px;font-weight:600;padding:9px 16px;cursor:pointer;}
  /* custom split row */
  .customrow{display:flex;gap:8px;padding:8px 16px 2px;}
  .customrow .cs{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;}
  .customrow .cs label{font-size:12px;color:var(--sub);white-space:nowrap;}
  .customrow .cs input{border:0;outline:none;background:transparent;font-family:inherit;font-size:15px;font-weight:700;color:var(--txt);width:100%;min-width:0;}
  .customrow .cs .rem{font-size:15px;font-weight:700;color:var(--sub);margin-left:auto;}
  /* editor */
  .efield{padding:6px 16px;}
  .efield label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;display:block;margin-bottom:5px;}
  .efield input,.efield select{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;
    font-size:15px;font-family:inherit;color:var(--txt);outline:none;-webkit-appearance:none;appearance:none;}
  .efield input:focus,.efield select:focus{border-color:var(--accent-line);}
  .erow{display:flex;}
  .erow .efield{flex:1;}
  .ebtns{display:flex;gap:8px;padding:12px 16px 4px;}
  .ebtn{flex:1;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:15px;font-weight:700;color:var(--txt);}
  .ebtn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  .ebtn.danger{color:#c0392b;}
  .edit-del{border-top:1px solid var(--line);margin:12px 16px 0;padding-top:12px;text-align:center;}
  .dellink{background:0;border:0;color:#c0392b;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;cursor:pointer;}
  .dellink svg{width:15px;height:15px;stroke:#c0392b;}
  /* balance bar (in expenses) */
  .balbar{padding:0 16px 8px;}
  .balbtn{width:100%;display:flex;align-items:center;justify-content:space-between;background:var(--accent-soft);
    border:1px solid var(--accent-line);border-radius:var(--radius);padding:14px 16px;color:var(--accent);font-size:15px;font-weight:700;}
  .balbtn .chev{font-size:20px;line-height:1;}
  /* balance page subhead */
  .subhead{display:flex;align-items:center;gap:10px;padding:2px 16px 10px;}
  .backbtn{background:0;border:0;color:var(--accent);font-size:15px;font-weight:600;padding:4px 0;display:flex;align-items:center;gap:2px;}
  .subhead .st{font-size:18px;font-weight:800;}
  /* books page */
  .bookslist{padding:6px 16px;}
  .bookcard{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);margin-bottom:10px;cursor:pointer;}
  .bookcard.on{border-color:var(--accent-line);}
  .bookcard .bi{width:40px;height:40px;border-radius:11px;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--txt);}
  .bookcard.on .bi{color:var(--accent);}
  .bookcard svg{width:20px;height:20px;}
  .bookcard .bn{font-size:15px;font-weight:700;}
  .bookcard .bm{font-size:12px;color:var(--sub);margin-top:1px;}
  .bookcard .bt{font-size:15px;font-weight:800;white-space:nowrap;}
  .addbook{width:calc(100% - 32px);margin:2px 16px;padding:15px;border-radius:var(--radius);border:1px dashed var(--muted);
    background:var(--card);color:var(--accent);font-size:15px;font-weight:700;}
  /* tabbar */
  .tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;
    background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-around;padding:8px 0 24px;z-index:20;}
  .tab{flex:1;text-align:center;color:var(--muted);font-size:11px;font-weight:600;background:0;border:0;}
  .tab svg{width:23px;height:23px;display:block;margin:0 auto 3px;}
  .tab.on{color:var(--accent);}
  /* book picker */
  .sheet-bg{position:fixed;inset:0;background:rgba(20,20,20,.32);z-index:40;display:flex;align-items:flex-end;justify-content:center;}
  .sheet{background:var(--bg);width:100%;max-width:440px;border-radius:20px 20px 0 0;padding:10px 14px 28px;}
  .sheet h3{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:8px 8px 10px;font-weight:700;}
  .bookopt{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);margin-bottom:8px;}
  .bookopt.on{border-color:var(--accent-line);background:var(--accent-soft);}
  .bookopt .bi{width:38px;height:38px;border-radius:11px;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--txt);}
  .bookopt.on .bi{background:#fff;color:var(--accent);}
  .bookopt svg{width:20px;height:20px;}
  .bookopt .bn{font-size:15px;font-weight:700;}
  .bookopt .bm{font-size:12px;color:var(--sub);margin-top:1px;}
  .toast{position:fixed;bottom:112px;left:50%;transform:translateX(-50%);background:var(--txt);
    color:#fff;font-weight:700;font-size:14px;padding:11px 18px;border-radius:22px;opacity:0;
    transition:opacity .2s;z-index:50;pointer-events:none;}
  .toast.show{opacity:1;}
  .toast.act{pointer-events:auto;display:inline-flex;align-items:center;gap:14px;}
  .toast .undo{background:0;border:0;color:#8fbaff;font-weight:800;font-size:14px;cursor:pointer;}
  .link{background:0;border:0;color:var(--accent);font-size:13px;font-weight:600;}
  /* login */
  .login{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;}
  .login .card{width:100%;max-width:340px;}
  .login .ic{width:64px;height:64px;border-radius:16px;margin:0 auto 14px;display:block;}
  .login h1{font-size:22px;font-weight:800;margin:0 0 4px;text-align:center;}
  .login .p{font-size:13px;color:var(--sub);text-align:center;margin:0 0 20px;}
  .login input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:13px 14px;font-size:16px;font-family:inherit;color:var(--txt);outline:none;margin-bottom:10px;}
  .login input:focus{border-color:var(--accent-line);}
  .login button{width:100%;padding:14px;border-radius:12px;background:var(--accent);border:0;color:#fff;font-size:16px;font-weight:700;}
  .login button:disabled{opacity:.5;}
  .login .err{color:#c0392b;font-size:13px;text-align:center;min-height:18px;margin-top:8px;}
  /* icon buttons + search */
  .iconbtn{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--sub);
    display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;}
  .iconbtn svg{width:18px;height:18px;}
  .iconbtn.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);}
  .searchbar{padding:0 16px 8px;}
  .searchbar .box{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:10px 14px;}
  .searchbar .box svg{width:16px;height:16px;color:var(--muted);flex:0 0 auto;}
  .searchbar input{flex:1;border:0;outline:none;background:transparent;font-family:inherit;font-size:15px;color:var(--txt);min-width:0;}
  .searchbar .clr{background:0;border:0;color:var(--muted);font-size:15px;cursor:pointer;padding:0 2px;flex:0 0 auto;}
  .bookbadge{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--card2);color:var(--sub);margin-left:6px;vertical-align:1px;}
  /* book ⋮ menu rows */
  .menurow{display:flex;align-items:center;gap:11px;padding:14px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);margin-bottom:8px;font-size:15px;font-weight:600;color:var(--txt);cursor:pointer;}
  .menurow svg{width:19px;height:19px;color:var(--accent);}
  /* insights */
  .ins-head{display:flex;gap:8px;padding:4px 16px 10px;}
  .inschip{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--card);
    border:1px solid var(--line);border-radius:22px;padding:10px 12px;font-size:13.5px;font-weight:700;color:var(--txt);cursor:pointer;}
  .inschip .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:0 0 auto;}
  .inschip .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .inschip .chev{color:var(--muted);font-size:11px;flex:0 0 auto;}
  .insseg{display:flex;gap:6px;padding:0 16px 12px;}
  .insseg .opt{flex:1;text-align:center;padding:8px 0;border-radius:10px;background:var(--card);border:1px solid var(--line);
    font-size:13px;font-weight:700;color:var(--sub);cursor:pointer;}
  .insseg .opt.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);}
  .inscard{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:0 16px 12px;padding:14px 16px;}
  .insstep{display:flex;align-items:center;justify-content:center;gap:18px;padding-bottom:10px;}
  .insstep .nav{width:30px;height:30px;border-radius:50%;background:var(--card2);border:0;color:var(--accent);font-size:16px;
    font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;}
  .insstep .nav:disabled{opacity:.3;}
  .insstep .plabel{font-size:15px;font-weight:800;min-width:130px;text-align:center;}
  .instot{display:flex;align-items:baseline;justify-content:space-between;}
  .instot .big{font-size:25px;font-weight:800;letter-spacing:-.5px;}
  .instot .delta{font-size:12px;font-weight:700;}
  .instot .delta.down{color:var(--green);}
  .instot .delta.up{color:#c0392b;}
  .instot .delta.flat{color:var(--muted);}
  .trend{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;height:78px;margin-top:12px;}
  .trend .tb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;cursor:pointer;}
  .trend .stack{width:100%;max-width:30px;border-radius:5px 5px 0 0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;}
  .trend .stack .seg{display:block;width:100%;}
  .trend .tl{font-size:10px;color:var(--muted);}
  .trend .tb.sel .stack{box-shadow:0 0 0 2px var(--accent);}
  .trend .tb.sel .tl{color:var(--accent);font-weight:800;}
  .trendcap{text-align:center;font-size:10.5px;color:var(--muted);margin-top:9px;}
  .inslegend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:0 16px 12px;}
  .inslegend .lg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--sub);font-weight:600;}
  .inslegend .sw{width:10px;height:10px;border-radius:3px;flex:0 0 auto;}
  .inslabel{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding:2px 20px 7px;}
  .catrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:11px 12px 11px 14px;margin:0 16px 6px;cursor:pointer;}
  .catrow .cico{width:22px;height:22px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 22px;}
  .catrow .cico svg{width:14px;height:14px;}
  .catrow .cmid{flex:1;min-width:0;}
  .catrow .ctop{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;}
  .catrow .camt{font-weight:800;}
  .catrow .cbar{height:5px;border-radius:3px;margin-top:5px;min-width:4px;}
  .catrow .cchev{color:var(--muted);font-size:16px;flex:0 0 auto;}
  .ins-empty{color:var(--muted);text-align:center;padding:36px 24px;font-size:14px;line-height:1.6;}
</style>

      <h1>Couple Expense Tracker</h1>
      <div class="p">Sign in with your shared account</div>
      <form onsubmit="doLogin(event)">
        <input type="email" id="login-email" placeholder="email" autocomplete="username" inputmode="email">
        <input type="password" id="login-pass" placeholder="password" autocomplete="current-password">
        <button type="submit" id="login-btn">Sign in</button>
        <div class="err" id="login-err"></div>
      </form>
    </div>
  </div>

  <header class="appbar" id="appbar">
    <button class="bookchip" onclick="openPicker()">
      <span class="bemoji" id="book-emoji"></span><span class="nm" id="book-name">Couple</span>
      <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="appbar-right">
      <button class="iconbtn hidden" id="search-btn" onclick="toggleSearch()" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.4-3.4"/></svg></button>
      <button class="iconbtn hidden" id="book-menu-btn" onclick="openBookMenu()" aria-label="Book options"><svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button>
      <button class="whoami hidden" id="whoami" onclick="toggleMe()"><span class="dot"></span><span id="me-name">Thibaud</span></button>
    </div>
  </header>

  <div class="searchbar hidden" id="searchbar">
    <div class="box"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.4-3.4"/></svg>
      <input id="search-input" placeholder="Search" autocomplete="off" oninput="onSearchInput()"><button class="clr" onclick="clearSearch()" aria-label="Clear">✕</button></div>
  </div>

  <!-- ============ CAPTURE (default) ============ -->
  <section id="view-add">
    <div class="amount-wrap"><span class="cur">$</span><input id="amt-input" class="amount-input" inputmode="decimal" enterkeyhint="next" placeholder="0" autocomplete="off"></div>

    <div class="namewrap"><input id="name-input" class="nameinput" enterkeyhint="done" placeholder="What was it? — e.g. Nofrills" autocomplete="off"></div>

    <div id="category-block">
      <div class="catgrid" id="catgrid"></div>
    </div>

    <div class="pillrow" id="pillrow">
      <button class="cpill hidden" id="paid-pill" onclick="cyclePaid()"></button>
      <button class="cpill hidden" id="split-pill" onclick="toggleSplitPanel()"></button>
      <div class="cpill datepill" id="date-pill"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 9h16M8 3v4M16 3v4"/></svg><span class="plab" id="date-label">Today</span><input type="date" id="date-input" aria-label="Expense date" onchange="onDateChange()"></div>
    </div>
    <div class="split-panel hidden" id="split-panel">
      <div class="sopt" data-v="ours" onclick="pickSplit('ours')">50 / 50</div>
      <div class="sopt" data-v="mine" onclick="pickSplit('mine')">Just the payer</div>
      <div class="sopt" data-v="custom" onclick="pickSplit('custom')">Custom split…</div>
      <div class="sopt" data-v="transfer" onclick="pickSplit('transfer')">⇄ Transfer (settle up)</div>
      <div class="customrow hidden" id="custom-split"></div>
    </div>

    <button class="savebtn" id="savebtn" onclick="save()"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-11"/></svg><span id="save-label">Save expense</span></button>
  </section>

  <!-- ============ EXPENSES LIST ============ -->
  <section id="view-list" class="hidden">
    <div class="summary" id="summary"></div>
    <div class="balbar hidden" id="balbar"></div>
    <div id="list"></div>
  </section>

  <!-- ============ BALANCES ============ -->
  <section id="view-bal" class="hidden">
    <div class="subhead"><button class="backbtn" onclick="go('list')"><svg viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M15 6l-6 6 6 6"/></svg>Back</button><span class="st">Balances</span></div>
    <div class="balwrap" id="balwrap"></div>
    <div class="settle-note" id="settle-note"></div>
  </section>

  <!-- ============ BOOKS ============ -->
  <section id="view-books" class="hidden">
    <div class="subhead" style="padding-top:6px;justify-content:space-between"><span class="st">Your books</span>
      <button class="iconbtn" id="books-search-btn" onclick="toggleSearch()" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.4-3.4"/></svg></button></div>
    <div class="bookslist" id="bookslist"></div>
    <div style="text-align:center;padding:20px 0 8px;"><button class="link" id="books-footer" onclick="resetDemo()">Reset demo data</button></div>
  </section>

  <!-- ============ INSIGHTS ============ -->
  <section id="view-insights" class="hidden">
    <div class="ins-head">
      <button class="inschip" id="ins-person" onclick="openInsPerson()"><span class="dot"></span><span class="lab" id="ins-person-lab">Thibaud</span><span class="chev">▾</span></button>
      <button class="inschip" id="ins-books" onclick="openInsBooks()"><span class="lab" id="ins-books-lab">All books</span><span class="chev">▾</span></button>
    </div>
    <div class="insseg" id="ins-scope">
      <div class="opt on" data-s="month" onclick="setInsScope('month')">Month</div>
      <div class="opt" data-s="year" onclick="setInsScope('year')">Year</div>
      <div class="opt" data-s="all" onclick="setInsScope('all')">All</div>
    </div>
    <div id="ins-body"></div>
  </section>

  <!-- ============ CATEGORY DETAIL ============ -->
  <section id="view-catdetail" class="hidden">
    <div class="subhead"><button class="backbtn" onclick="go('insights')"><svg viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M15 6l-6 6 6 6"/></svg>Back</button><span class="st" id="cd-title">Category</span></div>
    <div id="cd-body"></div>
  </section>

  <nav class="tabbar">
    <button class="tab on" id="tab-add" onclick="go('add')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Add</button>
    <button class="tab" id="tab-list" onclick="go('list')"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Expenses</button>
    <button class="tab" id="tab-books" onclick="go('books')"><svg viewBox="0 0 24 24"><path d="M4 5a1 1 0 0 1 1-1h5a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4zM20 5a1 1 0 0 0-1-1h-5a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h6z"/></svg>Books</button>
    <button class="tab" id="tab-insights" onclick="go('insights')"><svg viewBox="0 0 24 24"><path d="M4 20V4M4 20h16M8 20v-6M12.5 20v-10M17 20v-4"/></svg>Insights</button>
  </nav>

  <div class="toast" id="toast">Saved</div>
</div>

/* ---------- seed data ---------- */
const COUPLE_ITEMS=[];
const DEFAULT_BOOKS=[
 {id:'couple',name:'Couple — Shared Living',type:'shared',members:['Thibaud','Chun'],items:[]},
 {id:'personal',name:'Personal',type:'solo',members:['Thibaud'],items:[]},
 {id:'work',name:'Work',type:'solo',members:['Thibaud'],items:[]}
];
const KEY='expenses_books_v3';

let books, curId='couple', me='Thibaud', draft, view='add';
let searchOpen=false, searchQuery='';
let insPerson='Thibaud', insScopeV='month', insPeriod=new Date().toISOString().slice(0,7), insBooksSel='all', cdCat=null;
const INSPALETTE=['#3f6ef2','#1f9d55','#c07d0a','#7a3fb0','#b23b3b','#1f7d95','#a5426f'];

function load(){
  try{const s=localStorage.getItem(KEY);if(s){books=JSON.parse(s);return;}}catch(e){}
  books=JSON.parse(JSON.stringify(DEFAULT_BOOKS));persist();
}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(books));}catch(e){}}
function saveCur(){try{localStorage.setItem('expenses_curbook',curId);}catch(e){}}
function restoreCur(){try{const c=localStorage.getItem('expenses_curbook');if(c&&books.some(b=>b.id===c))curId=c;}catch(e){}me=book().members[0];}
function resetDemo(){try{localStorage.removeItem(KEY);localStorage.removeItem('expenses_curbook');}catch(e){}load();curId='couple';me='Thibaud';renderAll();go('add');}
function book(){return books.find(b=>b.id===curId);}
function isShared(){return book().type==='shared';}

function money(n){return '$'+n.toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2});}
function shareOf(e,who){
  if(e.split==='custom'&&e.shares)return e.shares[who]||0;
  if(e.split==='solo'||e.split==='mine')return e.paidBy===who?e.amount:0;
  return e.amount/2;
}
function fmtDay(d){return new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function escapeHtml(s){return(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function escapeAttr(s){return(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function computeBalance(b){
  const M=b.members,paid={},owe={},xfer={};M.forEach(m=>{paid[m]=0;owe[m]=0;xfer[m]=0;});
  b.items.forEach(e=>{
    if(e.kind==='transfer'){ xfer[e.from]=(xfer[e.from]||0)+e.amount; xfer[e.to]=(xfer[e.to]||0)-e.amount; }
    else { paid[e.paidBy]=(paid[e.paidBy]||0)+e.amount; M.forEach(m=>owe[m]+=shareOf(e,m)); }
  });
  return {M,paid,owe,xfer,net:(paid[M[0]]-owe[M[0]])+xfer[M[0]]};
}
function balanceText(b){
  const {M,net}=computeBalance(b);
  if(Math.abs(net)<0.01)return'All settled up';
  return net>0?`${M[1]} owes ${M[0]} ${money(net)}`:`${M[0]} owes ${M[1]} ${money(-net)}`;
}
function bookIcon(b){return BOOKICON[b.id]||(b.type==='shared'?BOOKICON.couple:BOOKICON.personal);}

  document.getElementById('book-emoji').innerHTML=bookIcon(b);
  const w=document.getElementById('whoami');
  if(view==='list'&&isShared()){w.classList.remove('hidden');document.getElementById('me-name').textContent=me;}
  else w.classList.add('hidden');
  document.getElementById('search-btn').classList.toggle('hidden',view!=='list');
  document.getElementById('book-menu-btn').classList.toggle('hidden',view!=='list');
  document.getElementById('appbar').classList.toggle('hidden',view==='books'||view==='insights'||view==='catdetail');
}

/* ---------- list ---------- */
function renderList(){
  const b=book();
  let items=[...b.items].sort((a,z)=>a.date<z.date?1:a.date>z.date?-1:0);
  if(view==='list'&&searchQuery)items=items.filter(e=>matchExp(e,searchQuery));
  let grand=0,my=0;
  b.items.forEach(e=>{if(e.kind==='transfer')return;grand+=e.amount;my+=shareOf(e,me);});
  const sum=document.getElementById('summary');
  const bb=document.getElementById('balbar');
  if(isShared()){
    sum.innerHTML=`<div class="sumcard"><div class="lbl">${me}'s share</div><div class="val">${money(my)}</div></div>
      <div class="sumcard"><div class="lbl">Total expenses</div><div class="val">${money(grand)}</div></div>`;
    bb.innerHTML=`<button class="balbtn" onclick="go('bal')"><span>${balanceText(b)}</span><span class="chev">›</span></button>`;
    bb.classList.remove('hidden');
  }else{
    sum.innerHTML=`<div class="sumcard" style="flex:none;width:100%"><div class="lbl">Total — ${escapeHtml(b.name)}</div><div class="val">${money(grand)}</div></div>`;
    bb.innerHTML='';bb.classList.add('hidden');
  }
  const box=document.getElementById('list');
  if(!items.length){box.innerHTML=searchQuery?'<div class="empty">No matches for “'+escapeHtml(searchQuery)+'”.</div>':'<div class="empty">No expenses in this book yet.<br>Tap <b>Add</b> to log one.</div>';return;}
  let html='',cur=null;
  items.forEach(e=>{
    if(e.date!==cur){cur=e.date;html+=`<div class="dayhdr">${fmtDay(e.date)}</div>`;}
    if(e.kind==='transfer'){
      html+=`<div class="row" onclick="openEditor('${e.id}')">
        <div class="ico tr"><svg viewBox="0 0 24 24"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg></div>
        <div class="rmid"><div class="rdesc">${escapeHtml(e.desc||'Transfer')}<span class="pill">transfer</span></div><div class="rmeta">${e.from} → ${e.to}</div></div>
        <div class="ramt">${money(e.amount)}</div></div>`;
      return;
    }
    const mine=(isShared()&&e.split==='mine')?`<span class="pill">${e.paidBy} only</span>`:'';
    const meta=isShared()?`Paid by ${e.paidBy} · ${e.cat}`:e.cat;
    const cc=CATCOLOR[e.cat]||CATCOLOR['Other'];
    html+=`<div class="row" onclick="openEditor('${e.id}')">
      <div class="ico" style="background:${cc[0]};color:${cc[2]}">${svg(e.cat)}</div>
      <div class="rmid"><div class="rdesc">${escapeHtml(e.desc||e.cat)}${mine}</div><div class="rmeta">${meta}</div></div>
      <div class="ramt">${money(e.amount)}</div></div>`;
  });
  box.innerHTML=html;
}
/* ---------- editor ---------- */
function openEditor(id){
  const b=book();const e=b.items.find(x=>x.id===id);if(!e)return;
  const isTr=e.kind==='transfer';
  const M=['Thibaud','Chun']; // shared-book members (couple books are always these two)
  const catOpts=CATS.map(c=>`<option ${c===e.cat?'selected':''}>${escapeHtml(c)}</option>`).join('');
  const bookOpts=books.map(bk=>`<option value="${bk.id}" ${bk.id===curId?'selected':''}>${escapeHtml(bk.id==='couple'?'Couple — Shared Living':bk.name)}</option>`).join('');
  const from=e.from||M[0];
  const dirOpts=[[M[0],M[1]],[M[1],M[0]]].map(([f,t])=>`<option value="${f}" ${from===f?'selected':''}>${f} → ${t}</option>`).join('');
  const paidGuess=(e.paidBy&&M.includes(e.paidBy))?e.paidBy:M[0];
  const paidOpts=M.map(m=>`<option ${m===paidGuess?'selected':''}>${m}</option>`).join('');
  const sp=(e.split&&e.split!=='solo')?e.split:'ours';
  const sh0=e.shares?e.shares[M[0]]:(e.amount/2);
  const html=`<div class="sheet"><h3>Edit ${isTr?'transfer':'expense'}</h3>
    <div class="efield"><label>Book</label><select id="e-book" onchange="editorSync()">${bookOpts}</select></div>
    <div class="erow">
      <div class="efield"><label>Amount</label><input id="e-amt" inputmode="decimal" value="${e.amount}"></div>
      <div class="efield"><label>Date</label><input id="e-date" type="date" value="${e.date}"></div>
    </div>
    <div class="efield"><label>Name</label><input id="e-name" value="${escapeAttr(e.desc||'')}"></div>
    <div class="efield hidden" id="e-typewrap"><label>Type</label><select id="e-kind" onchange="editorSync()">
      <option value="expense" ${!isTr?'selected':''}>Expense</option>
      <option value="transfer" ${isTr?'selected':''}>Transfer</option></select></div>
    <div class="efield hidden" id="e-transfer"><label>Direction</label><select id="e-dir">${dirOpts}</select></div>
    <div class="efield" id="e-catfield"><label>Category</label><select id="e-cat">${catOpts}</select></div>
    <div class="efield hidden" id="e-paidwrap"><label>Paid by</label><select id="e-paid">${paidOpts}</select></div>
    <div class="efield hidden" id="e-splitwrap"><label>Split</label><select id="e-split" onchange="editorSync()">
      <option value="ours" ${sp==='ours'?'selected':''}>50 / 50</option>
      <option value="custom" ${sp==='custom'?'selected':''}>Custom</option>
      <option value="mine" ${sp==='mine'?'selected':''}>Just the payer</option></select></div>
    <div class="efield hidden" id="e-customwrap"><label>${M[0]} owes (rest to ${M[1]})</label><input id="e-share" inputmode="decimal" value="${(+sh0).toFixed(2)}"></div>
    <button class="ebtn primary" style="width:calc(100% - 32px);margin:12px 16px 2px" onclick="saveEditor('${id}')">Save</button>
    <button class="link" style="width:100%;padding:10px" onclick="closePicker()">Cancel</button>
    <div class="edit-del"><button class="dellink" onclick="deleteFromEditor('${id}')"><svg viewBox="0 0 24 24" style="fill:none;stroke-linecap:round;stroke-linejoin:round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>Delete ${isTr?'transfer':'expense'}</button></div></div>`;
  const bg=document.createElement('div');bg.className='sheet-bg';bg.id='picker';bg.innerHTML=html;
  bg.onclick=ev=>{if(ev.target===bg)closePicker();};
  document.body.appendChild(bg);
  editorSync();
}
function editorSync(){
  const bk=books.find(x=>x.id===document.getElementById('e-book').value);
  const shared=bk&&bk.type==='shared';
  document.getElementById('e-typewrap').classList.toggle('hidden',!shared);
  const kind=shared?document.getElementById('e-kind').value:'expense';
  const isTr=shared&&kind==='transfer';
  document.getElementById('e-transfer').classList.toggle('hidden',!isTr);
  document.getElementById('e-catfield').classList.toggle('hidden',isTr);
  document.getElementById('e-paidwrap').classList.toggle('hidden',!(shared&&!isTr));
  document.getElementById('e-splitwrap').classList.toggle('hidden',!(shared&&!isTr));
  const spv=document.getElementById('e-split').value;
  document.getElementById('e-customwrap').classList.toggle('hidden',!(shared&&!isTr&&spv==='custom'));
}
function saveEditor(id){
  const srcBook=book();const e=srcBook.items.find(x=>x.id===id);if(!e)return;
  const amt=parseFloat(document.getElementById('e-amt').value);
  if(!(amt>0)){alert('Enter a valid amount');return;}
  const targetId=document.getElementById('e-book').value;
  const tb=books.find(x=>x.id===targetId)||srcBook;
  const shared=tb.type==='shared';
  e.amount=Math.round(amt*100)/100;
  e.date=document.getElementById('e-date').value||e.date;
  const nm=(document.getElementById('e-name').value||'').trim();
  const kind=shared?document.getElementById('e-kind').value:'expense';
  if(kind==='transfer'){
    e.kind='transfer';
    const fr=document.getElementById('e-dir').value;
    e.from=fr;e.to=(tb.members[0]===fr?tb.members[1]:tb.members[0]);
    e.desc=nm||'Transfer';
    delete e.cat;delete e.paidBy;delete e.split;delete e.shares;
  }else{
    e.kind='expense';
    e.cat=document.getElementById('e-cat').value;
    e.desc=nm||e.cat;
    delete e.from;delete e.to;
    if(shared){
      e.paidBy=document.getElementById('e-paid').value;
      const spv=document.getElementById('e-split').value;e.split=spv;
      if(spv==='custom'){
        const M=tb.members;let s0=parseFloat(document.getElementById('e-share').value)||0;
        s0=Math.min(Math.max(0,s0),e.amount);
        e.shares={[M[0]]:Math.round(s0*100)/100,[M[1]]:Math.round((e.amount-s0)*100)/100};
      }else delete e.shares;
    }else{e.paidBy=tb.members[0];e.split='solo';delete e.shares;}
  }
  const moved=targetId!==srcBook.id;
  if(moved){
    const idx=srcBook.items.findIndex(x=>x.id===id);if(idx>=0)srcBook.items.splice(idx,1);
    tb.items.push(e);
  }
  persist();if(CLOUD)cloudUpsertExpense(e,targetId);closePicker();renderAll();toast(moved?'Moved to '+(tb.id==='couple'?'Couple':tb.name):'Updated');
}
let lastDeleted=null;
function deleteFromEditor(id){
  const b=book();const idx=b.items.findIndex(x=>x.id===id);if(idx<0)return;
  lastDeleted={bookId:b.id,item:b.items[idx]};
  b.items.splice(idx,1);persist();if(CLOUD)cloudDeleteExpense(id);closePicker();renderAll();
  toastUndo('Deleted');
}
function undoDelete(){
  if(!lastDeleted)return;
  const b=books.find(x=>x.id===lastDeleted.bookId);
  if(b){b.items.push(lastDeleted.item);persist();if(CLOUD)cloudInsertExpense(lastDeleted.item,b.id);}
  lastDeleted=null;
  const t=document.getElementById('toast');t.classList.remove('show','act');
  renderAll();
}

/* ---------- balances ---------- */
function renderBal(){
  const b=book();
  const note=document.getElementById('settle-note');
  if(!isShared()){
    document.getElementById('balwrap').innerHTML=`<div class="empty">Balances only apply to shared books.<br><b>${escapeHtml(b.name)}</b> is just yours.</div>`;
    note.textContent='';return;
  }
  const {M,paid,owe,net}=computeBalance(b);
  let hero;
  if(Math.abs(net)<0.01)hero=`<div class="who">All settled up</div><div class="big">${money(0)}</div>`;
  else if(net>0)hero=`<div class="who">${M[1]} owes ${M[0]}</div><div class="big" style="color:var(--green)">${money(net)}</div>`;
  else hero=`<div class="who">${M[0]} owes ${M[1]}</div><div class="big" style="color:var(--amber)">${money(-net)}</div>`;
  let rows='';M.forEach(m=>{rows+=`<div class="balrow"><div class="nm">${m}</div><div class="r">paid ${money(paid[m])}<br>share ${money(owe[m])}</div></div>`;});
  document.getElementById('balwrap').innerHTML=`<div class="balhero">${hero}</div>${rows}`;
  note.textContent='v1 shows the running balance only — settle up however you like in real life.';
}

/* ---------- capture ---------- */
function newDraft(){
  const iso=new Date().toISOString().slice(0,10);
  draft={kind:'expense',cat:'Groceries',paidBy:me,split:'ours',date:iso,isToday:true,customShare:null,from:null,to:null};
  splitPanelOpen=false;
  const ai=document.getElementById('amt-input');if(ai)ai.value='';
  const ni=document.getElementById('name-input');if(ni)ni.value='';
}
function otherMember(m){const M=book().members;return M[0]===m?M[1]:M[0];}
function amountVal(){const ai=document.getElementById('amt-input');return ai?parseFloat(ai.value):NaN;}
function updateSaveState(){document.getElementById('savebtn').disabled=!(amountVal()>0);}
function focusAmount(){const ai=document.getElementById('amt-input');if(ai)ai.focus();}
function renderCatGrid(){
  document.getElementById('catgrid').innerHTML=CATS.map(n=>{
    const on=draft.cat===n, c=CATCOLOR[n]||CATCOLOR['Other'];
    const style=`background:${on?c[1]:c[0]};border-color:${on?c[2]:'transparent'};`;
    const nstyle=on?` style="color:${c[2]}"`:'';
    return `<div class="cat${on?' on':''}" style="${style}" onclick="setCat(this.dataset.c)" data-c="${escapeHtml(n)}">${svg(n)}<div class="n"${nstyle}>${n}</div></div>`;
  }).join('');
}
let splitPanelOpen=false;
function splitLabel(s){return s==='ours'?'50 / 50':s==='mine'?'Just '+draft.paidBy:'Custom';}
function renderPills(){
  const isTransfer=isShared()&&draft.kind==='transfer';
  document.getElementById('paid-pill').innerHTML=`<span class="plab">${isTransfer?'From · '+draft.from:'Paid · '+draft.paidBy}</span><span class="chev">▾</span>`;
  document.getElementById('split-pill').innerHTML=`<span class="plab">${isTransfer?'⇄ Transfer':splitLabel(draft.split)}</span><span class="chev">▾</span>`;
}
function toggleSplitPanel(){splitPanelOpen=!splitPanelOpen;renderDraft();}
function cyclePaid(){
  if(isShared()&&draft.kind==='transfer'){draft.from=otherMember(draft.from);draft.to=otherMember(draft.from);}
  else draft.paidBy=otherMember(draft.paidBy);
  renderDraft();
}
function pickSplit(v){
  if(v==='transfer'){draft.kind='transfer';if(!draft.from){draft.from=draft.paidBy||me;draft.to=otherMember(draft.from);}splitPanelOpen=false;}
  else{draft.kind='expense';draft.split=v;if(v==='custom'){if(draft.customShare==null)draft.customShare=+((amountVal()||0)/2).toFixed(2);splitPanelOpen=true;}else splitPanelOpen=false;}
  renderDraft();
}
function renderDraft(){
  const shared=isShared();
  const isTransfer=shared&&draft.kind==='transfer';
  document.getElementById('paid-pill').classList.toggle('hidden',!shared);
  document.getElementById('split-pill').classList.toggle('hidden',!shared);
  document.getElementById('category-block').classList.toggle('hidden',isTransfer);
  const cs=document.getElementById('custom-split');
  const panel=document.getElementById('split-panel');
  if(shared){
    if(isTransfer&&!draft.from){draft.from=me;draft.to=otherMember(me);}
    renderPills();
    panel.classList.toggle('hidden',!splitPanelOpen);
    document.querySelectorAll('#split-panel .sopt').forEach(o=>{
      const on=(o.dataset.v==='transfer')?isTransfer:(!isTransfer&&o.dataset.v===draft.split);
      o.classList.toggle('on',on);
    });
    if(splitPanelOpen&&!isTransfer&&draft.split==='custom'){cs.classList.remove('hidden');renderCustomRow();}
    else cs.classList.add('hidden');
  }else{cs.classList.add('hidden');panel.classList.add('hidden');}
  document.getElementById('save-label').textContent=isTransfer?'Save transfer':'Save expense';
  document.getElementById('date-label').textContent=draft.isToday?'Today':fmtDay(draft.date);
  const di=document.getElementById('date-input');if(di)di.value=draft.date;
  renderCatGrid();
  updateSaveState();
}
function renderCustomRow(){
  const M=book().members,amt=amountVal()||0;
  const s0=draft.customShare!=null?draft.customShare:+(amt/2).toFixed(2);
  const s1=Math.max(0,+(amt-s0).toFixed(2));
  document.getElementById('custom-split').innerHTML=
    `<div class="cs"><label>${M[0]}</label><input id="cs0" inputmode="decimal" value="${s0}" oninput="onCustomInput()"></div>
     <div class="cs"><label>${M[1]}</label><span class="rem" id="cs1">${money(s1)}</span></div>`;
}
function onCustomInput(){
  const v=parseFloat(document.getElementById('cs0').value);
  draft.customShare=isNaN(v)?0:v;
  updateCustomRem();
}
function updateCustomRem(){
  const el=document.getElementById('cs1');if(!el)return;
  const amt=amountVal()||0,s0=draft.customShare!=null?draft.customShare:amt/2;
  el.textContent=money(Math.max(0,+(amt-s0).toFixed(2)));
}
function setCat(c){draft.cat=c;renderDraft();}
function setPaid(p){draft.paidBy=p;renderDraft();}
function setSplit(s){draft.split=s;if(s==='custom'){if(draft.customShare==null)draft.customShare=+((amountVal()||0)/2).toFixed(2);splitPanelOpen=true;}else{splitPanelOpen=false;}renderDraft();}
function onDateChange(){
  const v=document.getElementById('date-input').value;if(!v)return;
  draft.date=v;draft.isToday=(v===new Date().toISOString().slice(0,10));
  document.getElementById('date-label').textContent=draft.isToday?'Today':fmtDay(v);
}
function save(){
  const n=amountVal();if(!(n>0))return;
  const nm=(document.getElementById('name-input').value||'').trim();
  const b=book();
  const amt=Math.round(n*100)/100;
  let item;
  if(isShared() && draft.kind==='transfer'){
    const from=draft.from||me, to=draft.to||otherMember(from);
    item={id:'x'+Date.now(),kind:'transfer',date:draft.date,from:from,to:to,amount:amt,desc:nm||'Transfer'};
  }else{
    item={id:'x'+Date.now(),kind:'expense',date:draft.date,desc:nm||draft.cat,cat:draft.cat,amount:amt};
    if(isShared()){
      item.paidBy=draft.paidBy;item.split=draft.split;
      if(draft.split==='custom'){
        const M=b.members;let s0=Math.min(Math.max(0,draft.customShare||0),item.amount);
        item.shares={[M[0]]:Math.round(s0*100)/100,[M[1]]:Math.round((item.amount-s0)*100)/100};
      }
    }else{item.paidBy=b.members[0];item.split='solo';}
  }
  b.items.push(item);persist();renderAll();toast('Saved to '+(b.id==='couple'?'Couple':b.name));if(CLOUD)cloudInsertExpense(item,b.id);
  newDraft();renderDraft();focusAmount();
}

/* ---------- book picker ---------- */
function openPicker(){
  let html='<div class="sheet"><h3>Switch book</h3>';
  books.forEach(b=>{
    const meta=b.type==='shared'?b.members.join(' + '):b.members[0]+' · personal';
    html+=`<div class="bookopt${b.id===curId?' on':''}" onclick="chooseBook('${b.id}')">
      <div class="bi">${bookIcon(b)}</div>
      <div style="flex:1"><div class="bn">${escapeHtml(b.name)}</div><div class="bm">${escapeHtml(meta)} · ${b.items.length} expenses</div></div>
    </div>`;
  });
  html+='<button class="link" style="width:100%;padding:12px" onclick="closePicker()">Cancel</button></div>';
  const bg=document.createElement('div');bg.className='sheet-bg';bg.id='picker';bg.innerHTML=html;
  bg.onclick=e=>{if(e.target===bg)closePicker();};
  document.body.appendChild(bg);
}
function closePicker(){const p=document.getElementById('picker');if(p)p.remove();}
function chooseBook(id){
  curId=id;me=book().members[0];saveCur();closePicker();
  // keep the typed amount/name; only fix fields the new book invalidates
  if(!book().members.includes(draft.paidBy))draft.paidBy=me;
  if(draft.from&&!book().members.includes(draft.from)){draft.from=null;draft.to=null;}
  if(!isShared())draft.kind='expense';
  renderAll();renderDraft();updateSaveState();
}
function chooseBookGo(id){chooseBook(id);go('list');}

/* ---------- books page ---------- */
function renderBooks(){
  const list=document.getElementById('bookslist');
  const fb=document.getElementById('books-footer');
  if(view==='books'&&searchQuery){
    const res=[];
    books.forEach(b=>b.items.forEach(e=>{if(matchExp(e,searchQuery))res.push({b,e});}));
    res.sort((x,z)=>x.e.date<z.e.date?1:x.e.date>z.e.date?-1:0);
    list.innerHTML=res.length?res.map(({b,e})=>searchRow(b,e)).join(''):'<div class="empty">No matches for “'+escapeHtml(searchQuery)+'”.</div>';
    if(fb)fb.classList.add('hidden');
    return;
  }
  if(fb)fb.classList.remove('hidden');
  let html='';
  books.forEach(b=>{
    const total=b.items.reduce((s,e)=>s+e.amount,0);
    const sub=b.type==='shared'?balanceText(b):b.members[0]+' · personal';
    html+=`<div class="bookcard${b.id===curId?' on':''}" onclick="chooseBookGo('${b.id}')">
      <div class="bi">${bookIcon(b)}</div>
      <div style="flex:1;min-width:0"><div class="bn">${escapeHtml(b.name)}</div><div class="bm">${escapeHtml(sub)} · ${b.items.length} expenses</div></div>
      <div class="bt">${money(total)}</div></div>`;
  });
  list.innerHTML=html+`<button class="addbook" onclick="openAddBook()">+ Add book</button>`;
  if(fb){fb.textContent=CLOUD?'Sign out':'Reset demo data';fb.onclick=CLOUD?cloudSignOut:resetDemo;}
}
function searchRow(b,e){
  const badge=`<span class="bookbadge">${escapeHtml(b.id==='couple'?'Couple':b.name)}</span>`;
  if(e.kind==='transfer'){
    return `<div class="row" onclick="openFromSearch('${b.id}','${e.id}')"><div class="ico tr"><svg viewBox="0 0 24 24"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg></div><div class="rmid"><div class="rdesc">${escapeHtml(e.desc||'Transfer')}${badge}</div><div class="rmeta">${fmtDay(e.date)} · ${e.from} → ${e.to}</div></div><div class="ramt">${money(e.amount)}</div></div>`;
  }
  const cc=CATCOLOR[e.cat]||CATCOLOR['Other'];
  return `<div class="row" onclick="openFromSearch('${b.id}','${e.id}')"><div class="ico" style="background:${cc[0]};color:${cc[2]}">${svg(e.cat)}</div><div class="rmid"><div class="rdesc">${escapeHtml(e.desc||e.cat)}${badge}</div><div class="rmeta">${fmtDay(e.date)} · ${escapeHtml(e.cat)}</div></div><div class="ramt">${money(e.amount)}</div></div>`;
}
function openFromSearch(bookId,id){curId=bookId;me=book().members[0];saveCur();renderAppbar();openEditor(id);}
let nbOwner='shared';
function openAddBook(){
  nbOwner='shared';
  const html=`<div class="sheet"><h3>New book</h3>
    <div class="efield"><label>Name</label><input id="nb-name" placeholder="e.g. Trip 2027" autocomplete="off"></div>
    <div class="efield"><label>Who's it for?</label>
      <div class="seg" style="padding:0">
        <div class="opt on" id="nb-shared" onclick="nbSet('shared')">Both</div>
        <div class="opt" id="nb-Thibaud" onclick="nbSet('Thibaud')">Thibaud</div>
        <div class="opt" id="nb-Chun" onclick="nbSet('Chun')">Chun</div>
      </div></div>
    <div class="ebtns"><button class="ebtn" onclick="closePicker()">Cancel</button>
      <button class="ebtn primary" onclick="createBook()">Create book</button></div></div>`;
  const bg=document.createElement('div');bg.className='sheet-bg';bg.id='picker';bg.innerHTML=html;
  bg.onclick=ev=>{if(ev.target===bg)closePicker();};
  document.body.appendChild(bg);
  setTimeout(()=>{const el=document.getElementById('nb-name');if(el)el.focus();},50);
}
function nbSet(v){nbOwner=v;
  ['shared','Thibaud','Chun'].forEach(k=>document.getElementById('nb-'+k).classList.toggle('on',k===v));
}
function createBook(){
  const name=(document.getElementById('nb-name').value||'').trim();
  if(!name){alert('Give the book a name');return;}
  const shared=nbOwner==='shared';
  const b={id:'b'+Date.now(),name:name,type:shared?'shared':'solo',members:shared?['Thibaud','Chun']:[nbOwner],items:[]};
  books.push(b);persist();if(CLOUD)cloudInsertBook(b);curId=b.id;me=b.members[0];saveCur();closePicker();
  newDraft();renderDraft();go('list');toast('Book created');
}

/* ---------- shared sheet helper ---------- */
function mkSheet(html){const bg=document.createElement('div');bg.className='sheet-bg';bg.id='picker';bg.innerHTML=html;bg.onclick=ev=>{if(ev.target===bg)closePicker();};return bg;}

/* ---------- search ---------- */
function matchExp(e,q){if(!q)return true;q=(''+q).toLowerCase();
  return (e.desc||'').toLowerCase().includes(q)||(e.cat||'').toLowerCase().includes(q)||String(e.amount).includes(q)||(e.from||'').toLowerCase().includes(q)||(e.to||'').toLowerCase().includes(q);}
function positionSearchbar(){
  const sb=document.getElementById('searchbar');
  if(view==='books'){const sub=document.querySelector('#view-books .subhead');if(sub)sub.insertAdjacentElement('afterend',sb);}
  else{document.getElementById('appbar').insertAdjacentElement('afterend',sb);}
}
function toggleSearch(){
  searchOpen=!searchOpen;
  if(searchOpen)positionSearchbar();
  document.getElementById('searchbar').classList.toggle('hidden',!searchOpen);
  ['search-btn','books-search-btn'].forEach(x=>{const el=document.getElementById(x);if(el)el.classList.toggle('on',searchOpen);});
  if(searchOpen){const i=document.getElementById('search-input');i.value=searchQuery;setTimeout(()=>i.focus(),30);}
  else searchQuery='';
  rerenderSearch();
}
function onSearchInput(){searchQuery=document.getElementById('search-input').value;rerenderSearch();}
function clearSearch(){searchQuery='';const i=document.getElementById('search-input');i.value='';i.focus();rerenderSearch();}
function rerenderSearch(){if(view==='list')renderList();else if(view==='books')renderBooks();}

/* ---------- insights ---------- */
function personBooks(p){return books.filter(b=>b.members.includes(p));}
function insSelectedBooks(){const pb=personBooks(insPerson);if(insBooksSel==='all')return pb;return pb.filter(b=>insBooksSel.includes(b.id));}
function insBookColor(id){if(id==='couple')return '#3f6ef2';if(id==='personal')return '#1f9d55';if(id==='work')return '#c07d0a';const i=books.findIndex(x=>x.id===id);return INSPALETTE[(i<0?0:i)%INSPALETTE.length];}
function periodPred(scope,period){if(scope==='all')return ()=>true;if(scope==='year')return e=>e.date.slice(0,4)===period;return e=>e.date.slice(0,7)===period;}
function prevPeriod(scope,period){if(scope==='month'){let [y,m]=period.split('-').map(Number);m--;if(m<1){m=12;y--;}return y+'-'+String(m).padStart(2,'0');}if(scope==='year')return String(Number(period)-1);return null;}
function stepPeriod(scope,period,dir){if(scope==='month'){let [y,m]=period.split('-').map(Number);m+=dir;while(m<1){m+=12;y--;}while(m>12){m-=12;y++;}return y+'-'+String(m).padStart(2,'0');}if(scope==='year')return String(Number(period)+dir);return period;}
function fmtMonthFull(ym){const [y,m]=ym.split('-');return new Date(+y,+m-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});}
function fmtMonShort(ym){const [y,m]=ym.split('-');return new Date(+y,+m-1,1).toLocaleDateString('en-US',{month:'short'});}
function insSum(pred){let tot=0;const byCat={};insSelectedBooks().forEach(b=>b.items.forEach(e=>{if(e.kind==='transfer')return;if(!pred(e))return;const s=shareOf(e,insPerson);if(!s)return;tot+=s;byCat[e.cat]=(byCat[e.cat]||0)+s;}));return {tot,byCat};}
function trendRows(){
  const bks=insSelectedBooks();let periods=[];
  if(insScopeV==='month'){for(let i=5;i>=0;i--)periods.push(stepPeriod('month',insPeriod,-i));}
  else if(insScopeV==='year'){for(let m=1;m<=12;m++)periods.push(insPeriod+'-'+String(m).padStart(2,'0'));}
  else{const ys=new Set();bks.forEach(b=>b.items.forEach(e=>{if(e.kind!=='transfer'&&shareOf(e,insPerson))ys.add(e.date.slice(0,4));}));periods=[...ys].sort();if(!periods.length)periods=[String(new Date().getFullYear())];}
  const keyLen=(insScopeV==='all')?4:7;
  return periods.map(p=>{const per={};let t=0;bks.forEach(b=>{let s=0;b.items.forEach(e=>{if(e.kind==='transfer')return;if(e.date.slice(0,keyLen)!==p)return;s+=shareOf(e,insPerson);});if(s>0){per[b.id]=s;t+=s;}});return {period:p,per,total:t};});
}
function insBarTap(period){if(insScopeV==='month')insPeriod=period;else if(insScopeV==='year'){insScopeV='month';insPeriod=period;}else{insScopeV='year';insPeriod=period;}renderInsights();}
function insStep(dir){insPeriod=stepPeriod(insScopeV,insPeriod,dir);renderInsights();}
function setInsScope(s){
  if(s===insScopeV)return;
  const cur=new Date().toISOString().slice(0,10);
  if(s==='year'){insPeriod=(insPeriod&&insPeriod.slice(0,4))||cur.slice(0,4);}
  else if(s==='month'){const y=(insPeriod&&insPeriod.slice(0,4))||cur.slice(0,4);let mm;if(insScopeV==='year')mm=(y===cur.slice(0,4))?cur.slice(5,7):'12';else mm=(insPeriod&&/^\d{4}-\d{2}/.test(insPeriod))?insPeriod.slice(5,7):cur.slice(5,7);insPeriod=y+'-'+mm;}
  insScopeV=s;renderInsights();
}
function openInsPerson(){
  const html=`<div class="sheet"><h3>Whose spending</h3>`+
    ['Thibaud','Chun'].map(p=>`<div class="bookopt${p===insPerson?' on':''}" onclick="pickInsPerson('${p}')"><div class="bi"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.5 3.1-6 7-6s7 2.5 7 6"/></svg></div><div style="flex:1"><div class="bn">${p}</div></div></div>`).join('')
    +`<button class="link" style="width:100%;padding:12px" onclick="closePicker()">Cancel</button></div>`;
  document.body.appendChild(mkSheet(html));
}
function pickInsPerson(p){insPerson=p;insBooksSel='all';closePicker();renderInsights();}
function openInsBooks(){
  const pb=personBooks(insPerson);
  let html=`<div class="sheet"><h3>Which books</h3>`;
  html+=`<div class="bookopt${insBooksSel==='all'?' on':''}" onclick="insBooksAll()"><div class="bi"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></div><div style="flex:1"><div class="bn">All books</div></div>${insBooksSel==='all'?'<span style="color:var(--accent);font-weight:800">✓</span>':''}</div>`;
  pb.forEach(b=>{const on=Array.isArray(insBooksSel)&&insBooksSel.includes(b.id);html+=`<div class="bookopt${on?' on':''}" onclick="insBooksToggle('${b.id}')"><div class="bi">${bookIcon(b)}</div><div style="flex:1"><div class="bn">${escapeHtml(b.id==='couple'?'Couple':b.name)}</div></div>${on?'<span style="color:var(--accent);font-weight:800">✓</span>':''}</div>`;});
  html+=`<button class="ebtn primary" style="width:calc(100% - 32px);margin:8px 16px 2px" onclick="closePicker();renderInsights()">Done</button></div>`;
  document.body.appendChild(mkSheet(html));
}
function insBooksAll(){insBooksSel='all';insBooksRefresh();}
function insBooksToggle(id){
  const pb=personBooks(insPerson).map(b=>b.id);
  if(insBooksSel==='all'){insBooksSel=[id];}          // from "All", first tap isolates to just that book
  else{
    const i=insBooksSel.indexOf(id);if(i>=0)insBooksSel.splice(i,1);else insBooksSel.push(id);
    if(insBooksSel.length===0)insBooksSel='all';       // nothing selected → back to All
    else if(pb.every(x=>insBooksSel.includes(x)))insBooksSel='all'; // everything ticked → All
  }
  insBooksRefresh();
}
function insBooksRefresh(){closePicker();openInsBooks();renderInsights();}
function renderInsights(){
  document.getElementById('ins-person-lab').textContent=insPerson;
  const pb=personBooks(insPerson);
  let blabel;
  if(insBooksSel==='all')blabel='All books';
  else{const names=pb.filter(b=>insBooksSel.includes(b.id)).map(b=>b.id==='couple'?'Couple':b.name);blabel=!names.length?'No books':names.length===1?names[0]:names.length+' books';}
  document.getElementById('ins-books-lab').textContent=blabel;
  document.querySelectorAll('#ins-scope .opt').forEach(o=>o.classList.toggle('on',o.dataset.s===insScopeV));
  const body=document.getElementById('ins-body');
  const {tot,byCat}=insSum(periodPred(insScopeV,insPeriod));
  let plabel=insScopeV==='month'?fmtMonthFull(insPeriod):insScopeV==='year'?insPeriod:'All time';
  let deltaHtml='';
  if(insScopeV!=='all'){const pp=prevPeriod(insScopeV,insPeriod);if(pp){const prevTot=insSum(periodPred(insScopeV,pp)).tot;if(prevTot>0){const d=(tot-prevTot)/prevTot*100;const cls=Math.abs(d)<0.5?'flat':d<0?'down':'up';const arrow=d<-0.5?'▼':d>0.5?'▲':'▬';const plab=insScopeV==='month'?fmtMonShort(pp):pp;deltaHtml=`<span class="delta ${cls}">${arrow} ${Math.abs(Math.round(d))}% vs ${plab}</span>`;}}}
  const rows=trendRows();const maxT=Math.max(...rows.map(r=>r.total),1);const selBooks=insSelectedBooks();
  const bars=rows.map(r=>{
    const sel=(insScopeV==='month'&&r.period===insPeriod);
    const h=Math.max(Math.round(r.total/maxT*60),r.total>0?4:2);
    let segs='';selBooks.forEach(b=>{const v=r.per[b.id]||0;if(v<=0)return;const pct=Math.round(v/(r.total||1)*100);segs+=`<span class="seg" style="height:${pct}%;background:${insBookColor(b.id)}"></span>`;});
    const lab=(insScopeV==='all')?r.period:fmtMonShort(r.period);
    return `<div class="tb${sel?' sel':''}" onclick="insBarTap('${r.period}')"><div class="stack" style="height:${h}px">${segs}</div><span class="tl">${lab}</span></div>`;
  }).join('');
  const cap=insScopeV==='month'?'tap a bar to change month':insScopeV==='year'?'tap a month to drill in':'tap a year to drill in';
  const legend=selBooks.map(b=>`<span class="lg"><span class="sw" style="background:${insBookColor(b.id)}"></span>${escapeHtml(b.id==='couple'?'Couple':b.name)}</span>`).join('');
  const cats=Object.keys(byCat).sort((a,z)=>byCat[z]-byCat[a]);const maxC=Math.max(...cats.map(c=>byCat[c]),1);
  let catHtml;
  if(!cats.length)catHtml=`<div class="ins-empty">No spending for ${escapeHtml(insPerson)} in ${escapeHtml(plabel)}.</div>`;
  else catHtml=cats.map(c=>{const cc=CATCOLOR[c]||CATCOLOR['Other'];const w=Math.round(byCat[c]/maxC*100);return `<div class="catrow" onclick="openCatDetail('${escapeAttr(c)}')"><span class="cico" style="background:${cc[0]};color:${cc[2]}">${svg(c)}</span><div class="cmid"><div class="ctop"><span>${escapeHtml(c)}</span><span class="camt">${money(byCat[c])}</span></div><div class="cbar" style="width:${w}%;background:${cc[2]}"></div></div><span class="cchev">›</span></div>`;}).join('');
  const dis=insScopeV==='all'?'disabled':'';
  body.innerHTML=`<div class="inscard">
      <div class="insstep"><button class="nav" ${dis} onclick="insStep(-1)">‹</button><span class="plabel">${escapeHtml(plabel)}</span><button class="nav" ${dis} onclick="insStep(1)">›</button></div>
      <div class="instot"><span class="big">${money(tot)}</span>${deltaHtml}</div>
      <div class="trend">${bars}</div>
      <div class="trendcap">${cap}</div>
    </div>
    ${legend?`<div class="inslegend">${legend}</div>`:''}
    <div class="inslabel">By category</div>${catHtml}`;
}
function openCatDetail(cat){cdCat=cat;go('catdetail');}
function renderCatDetail(){
  document.getElementById('cd-title').textContent=cdCat;
  const pred=periodPred(insScopeV,insPeriod);const rows=[];
  insSelectedBooks().forEach(b=>b.items.forEach(e=>{if(e.kind==='transfer'||e.cat!==cdCat||!pred(e))return;const s=shareOf(e,insPerson);if(!s)return;rows.push({b,e,s});}));
  rows.sort((x,z)=>x.e.date<z.e.date?1:x.e.date>z.e.date?-1:0);
  const tot=rows.reduce((a,r)=>a+r.s,0);
  const scopeLbl=insScopeV==='month'?fmtMonthFull(insPeriod):insScopeV==='year'?insPeriod:'all time';
  let html=`<div class="summary"><div class="sumcard" style="flex:none;width:100%"><div class="lbl">${escapeHtml(insPerson)}'s ${escapeHtml(cdCat)} · ${escapeHtml(scopeLbl)}</div><div class="val">${money(tot)}</div></div></div>`;
  if(!rows.length){document.getElementById('cd-body').innerHTML=html+'<div class="empty">Nothing here.</div>';return;}
  let cur=null;
  rows.forEach(({b,e,s})=>{
    if(e.date!==cur){cur=e.date;html+=`<div class="dayhdr">${fmtDay(e.date)}</div>`;}
    const cc=CATCOLOR[e.cat]||CATCOLOR['Other'];const badge=`<span class="bookbadge">${escapeHtml(b.id==='couple'?'Couple':b.name)}</span>`;
    const meta=b.type==='shared'?('your share'+(e.amount!==s?' · of '+money(e.amount):'')):'full amount';
    html+=`<div class="row" onclick="openFromSearch('${b.id}','${e.id}')"><div class="ico" style="background:${cc[0]};color:${cc[2]}">${svg(e.cat)}</div><div class="rmid"><div class="rdesc">${escapeHtml(e.desc||e.cat)}${badge}</div><div class="rmeta">${meta}</div></div><div class="ramt">${money(s)}</div></div>`;
  });
  document.getElementById('cd-body').innerHTML=html;
}

/* ---------- nav ---------- */
function go(v){
  view=v;
  if(searchOpen){searchOpen=false;searchQuery='';document.getElementById('searchbar').classList.add('hidden');
    ['search-btn','books-search-btn'].forEach(x=>{const el=document.getElementById(x);if(el)el.classList.remove('on');});}
  ['add','list','bal','books','insights','catdetail'].forEach(x=>document.getElementById('view-'+x).classList.toggle('hidden',x!==v));
  const active=(v==='bal')?'list':(v==='catdetail')?'insights':v;
  ['add','list','books','insights'].forEach(x=>document.getElementById('tab-'+x).classList.toggle('on',x===active));
  if(v==='add'){newDraft();renderDraft();focusAmount();}
  if(v==='list')renderList();
  if(v==='bal')renderBal();
  if(v==='books')renderBooks();
  if(v==='insights')renderInsights();
  if(v==='catdetail')renderCatDetail();
  renderAppbar();window.scrollTo(0,0);
}
function toggleMe(){const M=book().members;me=me===M[0]?M[1]:M[0];document.getElementById('me-name').textContent=me;renderList();}
function toast(m){const t=document.getElementById('toast');t.classList.remove('act');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1400);}
function toastUndo(msg){const t=document.getElementById('toast');t.innerHTML=`${msg} <button class="undo" onclick="undoDelete()">Undo</button>`;t.classList.add('show','act');clearTimeout(t._t);t._t=setTimeout(()=>{t.classList.remove('show','act');t.textContent='Saved';lastDeleted=null;},4500);}
function renderAll(){renderAppbar();if(view==='list')renderList();if(view==='bal')renderBal();if(view==='books')renderBooks();if(view==='insights')renderInsights();if(view==='catdetail')renderCatDetail();}

/* ---------- cloud sync ---------- */
function toRow(item,bookId){return {id:item.id,book_id:bookId,date:item.date,description:item.desc||null,category:item.cat||null,amount:item.amount,paid_by:(item.paidBy||item.from)||null,split:item.split||null,shares:item.shares||null,kind:item.kind||'expense',to_member:item.to||null};}
function fromRow(r){if(r.kind==='transfer')return {id:r.id,kind:'transfer',date:r.date,from:r.paid_by,to:r.to_member,amount:Number(r.amount),desc:r.description};const it={id:r.id,kind:'expense',date:r.date,desc:r.description,cat:r.category,amount:Number(r.amount),paidBy:r.paid_by,split:r.split};if(r.shares)it.shares=r.shares;return it;}
async function cloudInsertExpense(item,bookId){const {error}=await supa.from('expenses').insert(toRow(item,bookId));if(error)cloudWarn(error);}
async function cloudUpsertExpense(item,bookId){const {error}=await supa.from('expenses').update(toRow(item,bookId||curId)).eq('id',item.id);if(error)cloudWarn(error);}
async function cloudDeleteExpense(id){const {error}=await supa.from('expenses').delete().eq('id',id);if(error)cloudWarn(error);}
async function cloudInsertBook(b){const {error}=await supa.from('books').insert({id:b.id,name:b.name,type:b.type,members:b.members,sort:Date.now()});if(error)cloudWarn(error);}
async function cloudRenameBook(id,name){const {error}=await supa.from('books').update({name}).eq('id',id);if(error)cloudWarn(error);}
function cloudWarn(error){console.error(error);toast('Sync error — check connection');}
async function cloudSignOut(){try{await supa.auth.signOut();}catch(e){}location.reload();}
async function cloudFetch(){
  const [r1,r2]=await Promise.all([
    supa.from('books').select('*').order('sort',{ascending:true}),
    supa.from('expenses').select('*')
  ]);
  if(r1.error||r2.error){console.error(r1.error||r2.error);try{const s=localStorage.getItem(KEY);if(s)books=JSON.parse(s);}catch(_){}if(!books)books=JSON.parse(JSON.stringify(DEFAULT_BOOKS));return;}
  const map={};
  books=(r1.data||[]).map(b=>{const bk={id:b.id,name:b.name,type:b.type,members:b.members,items:[]};map[b.id]=bk;return bk;});
  (r2.data||[]).forEach(r=>{const bk=map[r.book_id];if(!bk)return;bk.items.push(fromRow(r));});
  if(!books.length)books=JSON.parse(JSON.stringify(DEFAULT_BOOKS));
  try{localStorage.setItem(KEY,JSON.stringify(books));}catch(_){}
}
let rtTimer=null;
function subscribeRealtime(){
  supa.channel('rt')
    .on('postgres_changes',{event:'*',schema:'public',table:'expenses'},queueRefetch)
    .on('postgres_changes',{event:'*',schema:'public',table:'books'},queueRefetch)
    .subscribe();
}
function queueRefetch(){clearTimeout(rtTimer);rtTimer=setTimeout(async()=>{const kc=curId,km=me;await cloudFetch();curId=books.some(b=>b.id===kc)?kc:(books[0]&&books[0].id);me=(book().members.indexOf(km)>=0)?km:book().members[0];renderAll();},250);}
async function cloudBoot(){await cloudFetch();restoreCur();insPerson=(me==='Chun')?'Chun':'Thibaud';newDraft();renderDraft();renderAppbar();go('add');subscribeRealtime();}
function showLogin(){document.getElementById('login').classList.remove('hidden');}
function hideLogin(){document.getElementById('login').classList.add('hidden');}
async function doLogin(e){
  if(e&&e.preventDefault)e.preventDefault();
  const email=document.getElementById('login-email').value.trim();
  const pw=document.getElementById('login-pass').value;
  const err=document.getElementById('login-err');err.textContent='';
  const btn=document.getElementById('login-btn');btn.disabled=true;
  const {error}=await supa.auth.signInWithPassword({email,password:pw});
  btn.disabled=false;
  if(error){err.textContent=error.message;return;}
  hideLogin();await cloudBoot();
}
async function initCloud(){
  if(!supa){alert('Could not load the Supabase library (are you offline?).');return;}
  const {data}=await supa.auth.getSession();
  if(data&&data.session){await cloudBoot();}else{showLogin();}
}

/* ---------- boot ---------- */
if(CLOUD){ initCloud(); }
else { load();restoreCur();insPerson=(me==='Chun')?'Chun':'Thibaud';newDraft();renderDraft();renderAppbar();go('add'); }
</script>
